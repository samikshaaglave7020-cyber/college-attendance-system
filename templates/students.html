<!DOCTYPE html>
<html>

<head>
    <title>View Students</title>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <style>

        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #999;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #ddd;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 18px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Student List</h1>

    <table>

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Roll Number</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student['id'] }}</td>
            <td>{{ student['name'] }}</td>
            <td>{{ student['roll_no'] }}</td>
        </tr>

        {% endfor %}

    </table>

    <a href="/">Back to Home</a>

</div>

</body>

</html>
